# Builds, tests, signs, and publishes a guacdeploy release on a version tag
# push. See docs/release-and-verification.md for the verification model.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # publish the GitHub Release
  id-token: write # Sigstore keyless signing through GitHub Actions OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build guacdeploy for linux/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir dist
          go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}" \
            -o dist/guacdeploy_linux_amd64 ./cmd/guacdeploy
          cp scripts/get-guacdeploy.sh dist/get-guacdeploy.sh

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum guacdeploy_linux_amd64 get-guacdeploy.sh > SHA256SUMS

      # Pin the same cosign version the launcher pins, so the bundle format
      # written here is the format that version verifies.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v3.1.3"

      - name: Sign SHA256SUMS (Sigstore keyless)
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "guacdeploy $GITHUB_REF_NAME" \
            --notes "Install with the verified launcher: see docs/release-and-verification.md. Verification is mandatory; do not run the binary without it."
