# Apache Guacamole with SAML single sign-on, behind nginx.
# Settings come from .env. Use setup.sh to start or recreate the services;
# it supplies the credentials through an in-memory Compose override.

networks:
  guacnet:
    driver: bridge

services:

  guacd:
    image: guacamole/guacd:${GUAC_VERSION:?}
    networks: [guacnet]
    restart: always

  postgres:
    image: postgres:18-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/guacamole
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # Read by init/002-groups.sh on first start only.
      GUAC_ADMIN_GROUP: ${GUAC_ADMIN_GROUP:?}
      GUAC_OPERATOR_GROUP: ${GUAC_OPERATOR_GROUP:?}
    networks: [guacnet]
    restart: always
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./data:/var/lib/postgresql/data
    healthcheck:
      # TCP checks the supplied password, including on an existing database.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql --host=127.0.0.1 --username=\"$$POSTGRES_USER\" --dbname=\"$$POSTGRES_DB\" --no-password --command='SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  guacamole:
    image: guacamole/guacamole:${GUAC_VERSION:?}
    depends_on:
      guacd:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: guacamole_user
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-}
      # SAML authenticates. The database only authorises.
      SAML_IDP_METADATA_URL: ${SAML_IDP_METADATA_URL:?}
      # Entra ID rejects an entity ID that ends in "/". This must match the
      # identity provider exactly.
      SAML_ENTITY_ID: "https://${GUAC_HOSTNAME:?}/guacamole"
      SAML_CALLBACK_URL: "https://${GUAC_HOSTNAME}/guacamole/"
      SAML_STRICT: "true"
      SAML_DEBUG: "false"
      SAML_COMPRESS_REQUEST: "true"
      SAML_COMPRESS_RESPONSE: "true"
      SAML_GROUP_ATTRIBUTE: ${SAML_GROUP_ATTRIBUTE:-groups}
      EXTENSION_PRIORITY: "saml,postgresql"
      # nginx terminates TLS. Without this, Tomcat sees "http://", and the SAML
      # response fails validation because the callback URL says "https://".
      REMOTE_IP_VALVE_ENABLED: "true"
    networks: [guacnet]
    restart: always

  # Started only when COMPOSE_PROFILES in .env contains "cloudflare".
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run
    environment:
      # Not ":?" — Compose interpolates every service, even ones outside the active profile.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks: [guacnet]
    profiles: [cloudflare]
    restart: always
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.30-alpine
    depends_on: [guacamole]
    environment:
      GUAC_HOSTNAME: ${GUAC_HOSTNAME:?}
    networks: [guacnet]
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/log:/var/log/nginx
    restart: always
